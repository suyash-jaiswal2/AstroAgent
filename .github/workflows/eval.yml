name: Eval Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential gcc g++

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Build knowledge base
        working-directory: backend
        run: python knowledge_base/ingest.py

      - name: Start backend server
        working-directory: backend
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DATABASE_URL: sqlite+aiosqlite:///./test_astroagent.db
          ENV: development
        run: |
          uvicorn api.main:app --host 0.0.0.0 --port 8000 &
          echo "Waiting for server to start..."
          sleep 15

      - name: Verify server health
        run: curl -f http://localhost:8000/api/health

      - name: Run unit tests
        working-directory: backend
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pytest tests/ -v --tb=short

      - name: Run eval suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python eval/run_eval.py \
            --output eval/results/ci_run_${{ github.sha }}.json

      - name: Upload eval results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results-${{ github.sha }}
          path: eval/results/ci_run_${{ github.sha }}.json
          retention-days: 30

      - name: Check eval pass rate
        run: |
          python - <<'EOF'
          import json, sys
          from pathlib import Path
          results = json.loads(Path("eval/results/ci_run_${{ github.sha }}.json").read_text())
          passed = sum(1 for r in results if r.get("passed"))
          total = len(results)
          rate = passed / total
          print(f"Eval: {passed}/{total} passed ({rate:.1%})")
          # Fail CI if below 70% pass rate
          if rate < 0.70:
              print(f"FAIL: Pass rate {rate:.1%} below 70% threshold")
              sys.exit(1)
          print("PASS: Meets 70% threshold")
          EOF